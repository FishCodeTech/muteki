name: sync-github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published GitHub release tag to mirror (for example v0.5.1)"
        required: true
        type: string
      dry_run:
        description: "Validate and compare assets without changing AtomGit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  max: 1
  exceed-action: QUEUE

permissions:
  repository: write
  project: read
  pr: none
  issue: none
  note: none

jobs:
  sync:
    name: Pull GitHub release and mirror to AtomGit
    runs-on: [ubuntu-latest, x64, small]
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      GITHUB_SOURCE_REPOSITORY: ${{ vars.GITHUB_SOURCE_REPOSITORY || 'FishCodeTech/muteki' }}
      ATOMGIT_TARGET_REPOSITORY: ${{ vars.ATOMGIT_TARGET_REPOSITORY || 'FishCodeTech/muteki' }}
    steps:
      - name: Checkout repository
        uses: checkout
      - name: Download published GitHub release metadata and assets
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          work_dir="${RUNNER_TEMP:-/tmp}/atomgit-release-sync"
          rm -rf "$work_dir"
          mkdir -p "$work_dir/assets"
          python3 -u scripts/sync_atomgit_release.py \
            --fetch-github-repo "$GITHUB_SOURCE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --release-json "$work_dir/github-release.json" \
            --assets-dir "$work_dir/assets" \
            --download-only \
            --workers 4
      - name: Verify mirrored tag and upload attachments to AtomGit
        env:
          RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP:-/tmp}/atomgit-release-sync"
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          SOURCE_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          export ATOMGIT_TOKEN="${RELEASE_SYNC_TOKEN:-${ATOMGIT_TOKEN:-}}"
          ARGS=()
          if [ "$DRY_RUN" = true ] || [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 -u scripts/sync_atomgit_release.py \
            --release-json "$work_dir/github-release.json" \
            --assets-dir "$work_dir/assets" \
            --target-commitish "$SOURCE_COMMIT" \
            --repository "$ATOMGIT_TARGET_REPOSITORY" \
            --workers 4 \
            "${ARGS[@]}"
