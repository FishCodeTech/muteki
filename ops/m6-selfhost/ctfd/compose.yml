name: muteki-m6-ctfd

services:
  db:
    image: mariadb:10.11@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
    container_name: muteki-m6-ctfd-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${CTFD_DB_ROOT_PASSWORD}
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}
      MARIADB_DATABASE: ctfd
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --wait_timeout=28800
      - --log-warnings=0
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]

  cache:
    image: redis:4@sha256:2e03fdd159f4a08d2165ca1c92adde438ae4e3e6b0f74322ce013a78ee81c88d
    container_name: muteki-m6-ctfd-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  web:
    image: ctfd/ctfd:3.8.7@sha256:284f1f06c5464108c4eaaea8a28934cb1e81d491e3f0fe60f3d686cf38593e41
    container_name: muteki-m6-ctfd-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:34101:8000"
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY}
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD}@db/ctfd
      REDIS_URL: redis://cache:6379
      WORKERS: "1"
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      REVERSE_PROXY: "false"
    volumes:
      - ./data/uploads:/var/uploads
      - ./data/logs:/var/log/CTFd
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [default, internal]

networks:
  default:
    name: muteki-m6-ctfd-public
  internal:
    name: muteki-m6-ctfd-internal
    internal: true
