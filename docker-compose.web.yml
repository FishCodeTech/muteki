name: ${MUTEKI_COMPOSE_PROJECT:-muteki}

services:
  runner:
    image: ${MUTEKI_WEB_IMAGE:-muteki-web:latest}
    entrypoint: ["/opt/muteki/bin/muteki-server", "runner"]
    command: ["--state-dir", "${MUTEKI_HOST_DATA_ROOT}/state"]
    restart: unless-stopped
    stop_signal: SIGINT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MUTEKI_HOST_DATA_ROOT:?set MUTEKI_HOST_DATA_ROOT to an absolute host path}:${MUTEKI_HOST_DATA_ROOT}
    environment:
      MUTEKI_STATE_DIR: ${MUTEKI_HOST_DATA_ROOT}/state
      MUTEKI_CONTROL_BIND: 0.0.0.0
      MUTEKI_CONTROL_CONNECT_HOST: runner
      MUTEKI_WORKER_NETWORK: ${MUTEKI_WORKER_NETWORK:-${COMPOSE_PROJECT_NAME:-muteki}_web_net}
      MUTEKI_WORKER_IMAGE: ${MUTEKI_WORKER_IMAGE:-muteki-worker:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [worker]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--unix-socket", "${MUTEKI_HOST_DATA_ROOT}/state/runner/control.sock", "http://localhost/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: ${MUTEKI_WEB_IMAGE:-muteki-web:latest}
    restart: unless-stopped
    ports:
      - "${MUTEKI_WEB_BIND:-127.0.0.1}:${MUTEKI_WEB_PORT:-3101}:3101"
    volumes:
      - ${MUTEKI_HOST_DATA_ROOT:?set MUTEKI_HOST_DATA_ROOT to an absolute host path}:${MUTEKI_HOST_DATA_ROOT}
      - ${MUTEKI_HOST_DATA_ROOT}/state/runner:${MUTEKI_HOST_DATA_ROOT}/state/runner:ro
    depends_on:
      runner:
        condition: service_healthy
    environment:
      MUTEKI_DEPLOYMENT_MODE: compose
      MUTEKI_INSTALL_ROOT: ${MUTEKI_HOST_DATA_ROOT}/install
      MUTEKI_STATE_DIR: ${MUTEKI_HOST_DATA_ROOT}/state
      MUTEKI_UI_HOST: 0.0.0.0
      MUTEKI_API_PORT: "8100"
      MUTEKI_UI_PORT: "3101"
      MUTEKI_WEB_PASSWORD: ${MUTEKI_WEB_PASSWORD:?set MUTEKI_WEB_PASSWORD}
      MUTEKI_RUNNER_SOCKET: ${MUTEKI_HOST_DATA_ROOT}/state/runner/control.sock
      MUTEKI_WORKER_NETWORK: ${MUTEKI_WORKER_NETWORK:-${COMPOSE_PROJECT_NAME:-muteki}_web_net}
      MUTEKI_WORKER_IMAGE: ${MUTEKI_WORKER_IMAGE:-muteki-worker:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [worker]
    healthcheck:
      test: ["CMD-SHELL", "scheme=http; [ -n \"$$MUTEKI_WEB_TLS_CERT\" ] && scheme=https; curl -fkSs \"$$scheme://127.0.0.1:$${MUTEKI_UI_PORT:-3101}/api/health\""]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  worker:
    name: ${MUTEKI_WORKER_NETWORK:-${COMPOSE_PROJECT_NAME:-muteki}_web_net}
