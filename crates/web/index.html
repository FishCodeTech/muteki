<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Muteki</title>
  <style>
    html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#fafafa;color:#202020;font:14px system-ui,sans-serif}
    #loading{position:fixed;inset:0;display:grid;place-content:center;padding:32px;white-space:pre-wrap}
    @media(prefers-color-scheme:dark){body{background:#151515;color:#eee}}
  </style>
</head>
<body>
  <div id="app" aria-label="Muteki"></div>
  <div id="loading" role="status">正在启动 Muteki…</div>
  <script type="module">
    import { createPlayer } from './nsh.js';
    const status = document.querySelector('#loading');
    let failed = false;
    const fail = (error) => {
      failed = true;
      console.error(error);
      status.hidden = false;
      status.style.display = 'grid';
      status.setAttribute('role', 'alert');
      status.textContent = `Muteki 启动失败。\n${error?.message ?? error}\n请检查服务是否运行，并刷新重试。`;
    };
    try {
      const response = await fetch('./assets/assets.json');
      if (!response.ok) throw new Error(`UI assets: HTTP ${response.status}`);
      const manifest = await response.json();
      const assets = Object.fromEntries(manifest.files.map(path => [path, new URL(`./assets/${path}`, location.href).href]));
      const fontBytes = new Map(await Promise.all(manifest.fonts.map(async (path) => {
        const response = await fetch(assets[path]);
        if (!response.ok) throw new Error(`Font ${path}: HTTP ${response.status}`);
        return [`asset:/${path}`, new Uint8Array(await response.arrayBuffer())];
      })));
      const player = await createPlayer(document.querySelector('#app'), {
        wasm: './muteki.wasm', assets,
        readAsset: uri => fontBytes.get(uri) ?? null,
        idiom: 'desktop', dialogs: 'viewport', onError: fail,
      });
      player.runRust();
      if (!failed) status.style.display = 'none';
      window.addEventListener('pagehide', () => player.stop(), { once: true });
    } catch (error) { fail(error); }
  </script>
</body>
</html>
