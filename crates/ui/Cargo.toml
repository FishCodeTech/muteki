[package]
name = "muteki-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
nsh-core = { path = "../../vendor/upstream-nsh/crates/nsh-core" }
nsh-base = { path = "../../vendor/upstream-nsh/crates/nsh-base" }
serde_json = "1"
chrono = { version="0.4", default-features=false, features=["std"] }

[dev-dependencies]
nsh-engine = { path = "../../vendor/upstream-nsh/crates/nsh-engine", default-features = false }
nsh-testing = { path = "../../vendor/upstream-nsh/crates/nsh-testing", default-features = false }
