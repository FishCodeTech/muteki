[project]
name = "project-muteki"
version = "0.4.2"
description = "Project Muteki (無敵): autonomous multi-model CTF-solving AI agent swarm"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anyio>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "requests>=2.31",
    "pyjwt>=2.8",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "gmpy2>=2.3.0",
    "sympy>=1.14.0",
    "pycryptodome>=3.23.0",
    "pillow>=12.2.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "magika>=1.0.3",
    # Keep Python 3.13 Intel macOS on the last ORT release with an x86_64 wheel.
    "onnxruntime==1.23.2; python_version == '3.13' and sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # This floor forces a separate uv lock fork while allowing future upgrades elsewhere.
    "onnxruntime>=1.26.0; python_version == '3.13' and (sys_platform != 'darwin' or platform_machine != 'x86_64')",
    "scapy>=2.7.0",
    "pyzbar>=0.1.9",
    "zxing-cpp>=3.0.0",
    "qrcode>=8.2",
    "ropgadget>=7.7",
    "capstone>=5.0.9",
    "r2pipe>=1.9.8",
    "lief>=0.17.6",
    "python-multipart>=0.0.9",
    "claude-agent-sdk>=0.1.0",
    "droid-sdk==0.5.0",
    "mcp>=1.10,<2",
]

[project.scripts]
muteki = "muteki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "muteki/external_agents/cursor_sdk_bridge/bridge.mjs",
    "muteki/external_agents/cursor_sdk_bridge/package.json",
    "muteki/external_agents/cursor_sdk_bridge/package-lock.json",
]
exclude = [
    "muteki/external_agents/cursor_sdk_bridge/node_modules/",
    "muteki/external_agents/cursor_sdk_bridge/node_modules/**",
]

[tool.hatch.build.targets.wheel]
packages = ["muteki"]

[tool.muteki]
deepseek_base_url = "https://api.deepseek.com/v1"
