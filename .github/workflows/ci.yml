name: ci

on:
  push:
    branches:
      - main
      - feat/web-beautiful-ui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Run Python tests
        run: uv run --frozen python -m pytest -q

  runtime-agent:
    name: Runtime agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cmd/runtime-agent/go.mod
          cache: false

      - name: Run Go tests
        run: go test -C cmd/runtime-agent ./...

  web-ui:
    name: Web UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web/ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build production UI
        run: npm run build
