name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_packages:
        description: Build and start packages on all three native platforms
        type: boolean
        default: false
      upload_packages:
        description: Keep downloadable native packages for three days
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for this change
        id: scope
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_PACKAGES: ${{ inputs.full_packages || inputs.upload_packages || false }}
        shell: bash
        run: |
          set -euo pipefail
          code=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            code=true
          else
            if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              BASE_SHA=$(git hash-object -t tree /dev/null)
            fi
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|README.md|README_CN.md|CHANGELOG.md|CONTRIBUTING.md|DISCLAIMER.md|SECURITY.md|LICENSE|LICENSE.*) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          packages=false
          if [[ "$REPOSITORY" == FishCodeTech/muteki && "$code" == true && "$EVENT" == workflow_dispatch && "$FULL_PACKAGES" == true ]]; then
            packages=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Frontend and API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm --prefix apps/frontend ci --no-audit --no-fund
      - name: Run frontend typecheck, lint, contracts, and property checks in parallel
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/frontend-checks"
          mkdir -p "$logs"
          declare -A pids=()
          declare -a names=(typecheck lint contracts lint_rules props)
          (npm --prefix apps/frontend run typecheck >"$logs/typecheck.log" 2>&1) & pids[typecheck]=$!
          (npm --prefix apps/frontend run lint >"$logs/lint.log" 2>&1) & pids[lint]=$!
          (python3 scripts/generate_frontend_contracts.py --check >"$logs/contracts.log" 2>&1) & pids[contracts]=$!
          (node scripts/lint_rules.mjs >"$logs/lint_rules.log" 2>&1) & pids[lint_rules]=$!
          (node scripts/verify/props_frontend.mjs >"$logs/props.log" 2>&1) & pids[props]=$!
          status=0
          for name in "${names[@]}"; do
            if wait "${pids[$name]}"; then
              echo "=== $name: PASS ==="
              cat "$logs/$name.log"
            else
              echo "=== $name: FAIL ==="
              cat "$logs/$name.log"
              status=1
            fi
          done
          exit "$status"

  rust:
    name: Rust server check
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.packages != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: .cache/target-check
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Ensure Linux native build tools
        shell: bash
        run: |
          set -euo pipefail
          pkgs=()
          command -v cc >/dev/null || pkgs+=(build-essential)
          command -v pkg-config >/dev/null || pkgs+=(pkg-config)
          if (( ${#pkgs[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Record Rust version
        id: rust
        shell: bash
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cache/target-check
          key: rust-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: rust-check-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - run: cargo clippy --locked -p muteki-server -- -A clippy::all -D clippy::disallowed_methods
      - name: Prune workspace build outputs before cache save
        shell: bash
        run: |
          rm -rf .cache/target-check/debug/incremental \
            .cache/target-check/debug/muteki-server* \
            .cache/target-check/debug/deps/muteki_server* \
            .cache/target-check/debug/.fingerprint/muteki-server-*

  packages:
    needs: [changes, frontend]
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      upload_packages: ${{ inputs.upload_packages || false }}

  checks:
    name: checks
    if: always()
    needs: [changes, frontend, rust, packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected checks
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.packages }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [[ "$CODE" == true ]]; then
            test "$FRONTEND" = success
            if [[ "$FULL" == true ]]; then
              test "$PACKAGES" = success
              test "$RUST" = skipped
            else
              test "$RUST" = success
              test "$PACKAGES" = skipped
            fi
          else
            test "$FRONTEND" = skipped
            test "$RUST" = skipped
            test "$PACKAGES" = skipped
          fi
