name: release-images

# Build the four Muteki images on native amd64/arm64 GitHub-hosted runners.
# Each architecture is pushed by digest. A merge job then publishes one tag
# containing exactly linux/amd64 and linux/arm64.
#
# provenance and SBOM descriptors are disabled for these release images so
# imagetools inspect does not show an extra unknown/unknown entry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_kali_worker:
        description: "Also build the heavy Kali muteki-worker image"
        type: boolean
        default: true
      tag:
        description: "Leave empty to use the branch or Git tag name. Existing release tags are overwritten only when entered explicitly."
        type: string
        required: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26"

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve release version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build application bundle
        run: python scripts/build_release_bundle.py --version "${{ steps.version.outputs.version }}" --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: muteki-release-bundle
          path: |
            dist/muteki-*.tar.gz
            dist/release-manifest.json
          if-no-files-found: error

  images:
    name: ${{ matrix.image }} (${{ matrix.target.arch }})
    strategy:
      fail-fast: false
      matrix:
        image:
          - muteki-web
          - muteki-ui
          - muteki-worker-slim
        target:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image build
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPOSITORY="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          {
            echo "tag=$TAG"
            echo "owner=$OWNER"
            echo "repository=$REPOSITORY"
          } >> "$GITHUB_OUTPUT"

          case "$IMAGE_NAME" in
            muteki-web)
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "file=docker/web/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                echo "IMAGE_VERSION=$TAG"
                echo "IMAGE_REVISION=$GITHUB_SHA"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            muteki-ui)
              echo "context=apps/web/ui" >> "$GITHUB_OUTPUT"
              echo "file=docker/ui/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                echo "MUTEKI_BACKEND=http://web-api:8000"
                echo "IMAGE_VERSION=$TAG"
                echo "IMAGE_REVISION=$GITHUB_SHA"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            muteki-worker-slim)
              echo "context=docker/worker-slim" >> "$GITHUB_OUTPUT"
              echo "file=docker/worker-slim/Dockerfile" >> "$GITHUB_OUTPUT"
              {
                echo "build_args<<EOF"
                echo "IMAGE_VERSION=$TAG"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported image: $IMAGE_NAME" >&2
              exit 2
              ;;
          esac

      - uses: actions/setup-go@v5
        if: ${{ matrix.image == 'muteki-worker-slim' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Stage slim Worker build context
        if: ${{ matrix.image == 'muteki-worker-slim' }}
        env:
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          ctx=docker/worker-slim
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent-$TARGET_ARCH" .
          cp docker/worker/AGENTS.md "$ctx/AGENTS.md"
          cp skills/muteki-blackboard/SKILL.md "$ctx/blackboard.SKILL.md"
          cp skills/muteki-blackboard/blackboard.py "$ctx/blackboard.py"
          cp muteki/solver/deepseek_harness_worker.py "$ctx/deepseek_harness_worker.py"
          cp muteki/solver/offline_acp_bridge.py "$ctx/offline_acp_bridge.py"
          cp muteki/solver/omp_offline_config.yml "$ctx/omp_offline_config.yml"
          cp muteki/solver/kimi_offline_agent.md "$ctx/kimi_offline_agent.md"
          cp muteki/solver/grok_offline_agent.md "$ctx/grok_offline_agent.md"
          chmod +x "$ctx/blackboard.py"
          file "$ctx/runtime_agent-$TARGET_ARCH" || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.file }}
          platforms: ${{ matrix.target.platform }}
          tags: ${{ steps.image.outputs.repository }}
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: ${{ steps.image.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.target.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.target.arch }},mode=max

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  worker:
    name: muteki-worker (${{ matrix.target.arch }})
    if: ${{ github.event_name == 'push' || github.event.inputs.build_kali_worker == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Resolve image build
        id: image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=$TAG"
            echo "owner=$OWNER"
            echo "repository=${REGISTRY}/${OWNER}/muteki-worker"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Stage full Worker build context
        env:
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          ctx=docker/worker
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent-$TARGET_ARCH" .
          cp skills/muteki-blackboard/SKILL.md "$ctx/blackboard.SKILL.md"
          cp skills/muteki-blackboard/blackboard.py "$ctx/blackboard.py"
          cp muteki/solver/deepseek_harness_worker.py "$ctx/deepseek_harness_worker.py"
          cp muteki/solver/offline_acp_bridge.py "$ctx/offline_acp_bridge.py"
          cp muteki/solver/omp_offline_config.yml "$ctx/omp_offline_config.yml"
          cp muteki/solver/kimi_offline_agent.md "$ctx/kimi_offline_agent.md"
          cp muteki/solver/grok_offline_agent.md "$ctx/grok_offline_agent.md"
          chmod +x "$ctx/blackboard.py"
          file "$ctx/runtime_agent-$TARGET_ARCH" || true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/worker
          file: docker/worker/Dockerfile
          platforms: ${{ matrix.target.platform }}
          tags: ${{ steps.image.outputs.repository }}
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache-${{ matrix.target.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache-${{ matrix.target.arch }},mode=max

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-muteki-worker-full-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.image }}
    needs: images
    strategy:
      fail-fast: false
      matrix:
        image:
          - muteki-web
          - muteki-ui
          - muteki-worker-slim
    runs-on: ubuntu-24.04
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish two-platform image index
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPOSITORY="${REGISTRY}/${OWNER}/${IMAGE_NAME}"

          mapfile -t DIGEST_FILES < <(find "${{ runner.temp }}/digests" -type f | sort)
          test "${#DIGEST_FILES[@]}" -eq 2
          SOURCES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${REPOSITORY}@sha256:$(basename "$digest_file")")
          done

          TAG_ARGS=(-t "${REPOSITORY}:${TAG}")
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_ARGS+=(-t "${REPOSITORY}:latest")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

          ACTUAL="$(docker buildx imagetools inspect "${REPOSITORY}:${TAG}" --raw |
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort)"
          EXPECTED=$'linux/amd64\nlinux/arm64'
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$ACTUAL"

  merge-worker:
    name: merge muteki-worker
    needs: worker
    if: ${{ github.event_name == 'push' || github.event.inputs.build_kali_worker == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-muteki-worker-full-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish two-platform image index
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPOSITORY="${REGISTRY}/${OWNER}/muteki-worker"

          mapfile -t DIGEST_FILES < <(find "${{ runner.temp }}/digests" -type f | sort)
          test "${#DIGEST_FILES[@]}" -eq 2
          SOURCES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            SOURCES+=("${REPOSITORY}@sha256:$(basename "$digest_file")")
          done

          TAG_ARGS=(-t "${REPOSITORY}:${TAG}")
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_ARGS+=(-t "${REPOSITORY}:latest")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

          ACTUAL="$(docker buildx imagetools inspect "${REPOSITORY}:${TAG}" --raw |
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort)"
          EXPECTED=$'linux/amd64\nlinux/arm64'
          test "$ACTUAL" = "$EXPECTED"
          printf '%s\n' "$ACTUAL"

  publish:
    needs: [bundle, merge, merge-worker]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.bundle.result == 'success' && needs.merge.result == 'success' && needs.merge-worker.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muteki-release-bundle
          path: dist
      - name: Create release with upgrade assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes --title "Muteki ${{ github.ref_name }}"
