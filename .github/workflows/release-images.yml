name: release-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_kali_worker:
        description: Also build the optional specialist heavy Worker image
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heavy:
    needs: publish-curated
    if: ${{ github.repository == 'FishCodeTech/muteki' && inputs.build_kali_worker }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify specialist Worker
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muteki-worker-heavy"
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muteki-worker"
          docker pull --platform "linux/$TARGET_ARCH" "$base:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET_ARCH"
          base_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$base:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET_ARCH")"
          docker build --pull --no-cache --platform "linux/$TARGET_ARCH" --load \
            -f docker/worker/Dockerfile.heavy \
            --build-arg "WORKER_IMAGE=$base_ref" \
            -t "$image:latest-$TARGET_ARCH" docker/worker
          scripts/verify_worker_image.sh --image "$image:latest-$TARGET_ARCH" \
            --variant heavy --platform "linux/$TARGET_ARCH"
          docker push "$image:latest-$TARGET_ARCH"

  publish-heavy:
    if: ${{ github.repository == 'FishCodeTech/muteki' && inputs.build_kali_worker }}
    needs: heavy
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish specialist multiarch index
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muteki-worker-heavy"
          docker buildx imagetools create -t "$image:latest" \
            "$image:latest-amd64" "$image:latest-arm64"

  curated:
    if: github.repository == 'FishCodeTech/muteki'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and exercise curated Worker on native architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muteki-worker"
          ref="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$TARGET_ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH="$TARGET_ARCH" \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/docker/worker/runtime_agent-$TARGET_ARCH" .
          python3 scripts/prepare_worker_capabilities.py
          mkdir -p image-evidence
          df -B1 > image-evidence/disk-before.txt
          (while sleep 10; do date -u; df -B1 "$GITHUB_WORKSPACE"; done) > image-evidence/disk-samples.txt &
          disk_monitor=$!
          trap 'kill "$disk_monitor" 2>/dev/null || true' EXIT
          docker buildx build --pull --no-cache --platform "linux/$TARGET_ARCH" --load \
            -f docker/worker/Dockerfile -t "$ref" docker/worker
          scripts/verify_worker_image.sh --image "$ref" --variant curated \
            --platform "linux/$TARGET_ARCH" | tee image-evidence/verification.txt
          docker image inspect "$ref" > image-evidence/image.json
          docker image inspect --format '{{.Size}}' "$ref" > image-evidence/expanded-bytes.txt
          docker save "$ref" | gzip -c | wc -c > image-evidence/archive-gzip-bytes.txt
          df -B1 > image-evidence/disk-after.txt
          tags=(-t "$ref" -t "$image:latest-$TARGET_ARCH")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(-t "$image:$GITHUB_REF_NAME-$TARGET_ARCH")
          fi
          docker buildx build --platform "linux/$TARGET_ARCH" --push \
            --sbom=true --provenance=mode=max \
            --metadata-file image-evidence/published.json \
            -f docker/worker/Dockerfile "${tags[@]}" docker/worker
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: worker-image-${{ matrix.arch }}
          path: image-evidence/

  publish-curated:
    needs: curated
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified curated multiarch index
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muteki-worker"
          docker buildx imagetools create -t "$image:latest" \
            "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" \
              "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          fi
