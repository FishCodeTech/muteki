name: release-images

# Build the four muteki images and push them to GitHub Container Registry (GHCR).
#
# Images (all under ghcr.io/<owner>/...):
#   muteki-web          — FastAPI control plane          (docker/web/Dockerfile,  context = repo root)
#   muteki-ui           — Next command deck              (docker/ui/Dockerfile,   context = apps/web/ui)
#   muteki-worker-slim  — ubuntu base + 9 engine CLIs + agent (docker/worker-slim, needs cross-compiled runtime_agent)
#   muteki-worker       — Kali base + full pentest kit   (docker/worker,          heavy: ~kali + 2.6G knowledges)
#
# Auth: the built-in GITHUB_TOKEN with packages:write — no PAT, no Docker Hub.
# Triggers:
#   - push v* tag        → build every artifact, create the GitHub Release, and move :latest
#   - workflow_dispatch  → pipeline test; tags with the input or branch name; no GitHub Release
#                          and does not move :latest (optionally skip the Kali worker)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_kali_worker:
        description: "Also build the heavy Kali muteki-worker image"
        type: boolean
        default: true
      tag:
        description: "Leave empty to tag images with the branch or git tag name. Do not enter an existing release tag unless you intend to overwrite that image."
        type: string
        required: false

# 发布任务需要创建 Release 并上传应用包；镜像任务写入 GHCR。
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve release version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build application bundle
        run: python scripts/build_release_bundle.py --version "${{ steps.version.outputs.version }}" --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: muteki-release-bundle
          path: |
            dist/muteki-*.tar.gz
            dist/release-manifest.json
          if-no-files-found: error

  # ── lightweight images: plain docker build-push ───────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          IMAGE_NAME: muteki-web
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:${TAG}"
            if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
            fi
          } | tee /tmp/image-tags.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            cat /tmp/image-tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image namespace: $OWNER"
          echo "Resolved tag: $TAG"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push muteki-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=muteki-web
          cache-to: type=gha,scope=muteki-web,mode=max

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          IMAGE_NAME: muteki-ui
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:${TAG}"
            if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
            fi
          } | tee /tmp/image-tags.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            cat /tmp/image-tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push muteki-ui
        uses: docker/build-push-action@v6
        with:
          context: apps/web/ui
          file: docker/ui/Dockerfile
          push: true
          # The Next standalone server freezes the /api proxy target at build time.
          # Bake the compose service alias so the composed stack works out of the box;
          # a non-compose deployment overrides NEXT/MUTEKI_BACKEND at its own build.
          build-args: |
            MUTEKI_BACKEND=http://web-api:8000
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=muteki-ui
          cache-to: type=gha,scope=muteki-ui,mode=max

  # ── worker images: cross-compile the Go runtime_agent, stage context, build ───
  worker-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          IMAGE_NAME: muteki-worker-slim
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:${TAG}"
            if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
            fi
          } | tee /tmp/image-tags.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            cat /tmp/image-tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # the runtime-agent module has no external deps (no go.sum), so the module
          # cache has nothing to restore — disable it to skip the "go.sum not found" warning
          cache: false

      - name: Stage build context (cross-compile runtime_agent + copy skill files)
        run: |
          set -euo pipefail
          ctx=docker/worker-slim
          echo ">> cross-compiling runtime_agent (linux/amd64, static)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent" .
          file "$ctx/runtime_agent" || true
          echo ">> staging AGENTS.md + blackboard skill + offline engine files"
          cp docker/worker/AGENTS.md "$ctx/AGENTS.md"
          cp skills/muteki-blackboard/SKILL.md "$ctx/blackboard.SKILL.md"
          cp skills/muteki-blackboard/blackboard.py "$ctx/blackboard.py"
          cp muteki/solver/deepseek_harness_worker.py "$ctx/deepseek_harness_worker.py"
          cp muteki/solver/offline_acp_bridge.py "$ctx/offline_acp_bridge.py"
          cp muteki/solver/omp_offline_config.yml "$ctx/omp_offline_config.yml"
          cp muteki/solver/kimi_offline_agent.md "$ctx/kimi_offline_agent.md"
          cp muteki/solver/grok_offline_agent.md "$ctx/grok_offline_agent.md"
          chmod +x "$ctx/blackboard.py"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push muteki-worker-slim
        uses: docker/build-push-action@v6
        with:
          context: docker/worker-slim
          file: docker/worker-slim/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=muteki-worker-slim
          cache-to: type=gha,scope=muteki-worker-slim,mode=max

  worker:
    runs-on: ubuntu-latest
    # The Kali image is large (kali-linux-headless + ~2.6G knowledges/pocs/templates).
    # Skip it on a manual run when the operator unchecks the input; always build on a
    # real release.
    if: ${{ github.event_name == 'push' || github.event.inputs.build_kali_worker == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The default runner has ~14G free; the Kali build needs more. Drop the big
        # preinstalled toolchains we don't use so the build doesn't ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Resolve image tag
        id: tag
        env:
          IMAGE_NAME: muteki-worker
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          [ -z "$TAG" ] && TAG="latest"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:${TAG}"
            if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest"
            fi
          } | tee /tmp/image-tags.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            cat /tmp/image-tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # the runtime-agent module has no external deps (no go.sum), so the module
          # cache has nothing to restore — disable it to skip the "go.sum not found" warning
          cache: false

      - name: Stage build context (cross-compile runtime_agent + copy skill files)
        run: |
          set -euo pipefail
          ctx=docker/worker
          echo ">> cross-compiling runtime_agent (linux/amd64, static)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cmd/runtime-agent -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/$ctx/runtime_agent" .
          file "$ctx/runtime_agent" || true
          echo ">> staging blackboard skill + offline engine files"
          cp skills/muteki-blackboard/SKILL.md "$ctx/blackboard.SKILL.md"
          cp skills/muteki-blackboard/blackboard.py "$ctx/blackboard.py"
          cp muteki/solver/deepseek_harness_worker.py "$ctx/deepseek_harness_worker.py"
          cp muteki/solver/offline_acp_bridge.py "$ctx/offline_acp_bridge.py"
          cp muteki/solver/omp_offline_config.yml "$ctx/omp_offline_config.yml"
          cp muteki/solver/kimi_offline_agent.md "$ctx/kimi_offline_agent.md"
          cp muteki/solver/grok_offline_agent.md "$ctx/grok_offline_agent.md"
          chmod +x "$ctx/blackboard.py"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push muteki-worker (Kali)
        uses: docker/build-push-action@v6
        with:
          context: docker/worker
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ steps.tag.outputs.tags }}
          # GHA cache has a 10G/repo cap; the Kali image alone can exceed it, so use a
          # registry-side cache image instead (does not count against the GHA cache).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/muteki-worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/muteki-worker:buildcache,mode=max

  publish:
    needs: [bundle, web, ui, worker-slim, worker]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.bundle.result == 'success' && needs.web.result == 'success' && needs.ui.result == 'success' && needs.worker-slim.result == 'success' && needs.worker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muteki-release-bundle
          path: dist
      - name: Create release with upgrade assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes --title "Muteki ${{ github.ref_name }}"
