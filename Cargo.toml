[workspace]
members = ["crates/server", "crates/desktop"]
default-members = ["crates/server"]
exclude = ["vendor/upstream-tcode", "vendor/upstream-nsh"]
resolver = "3"

[profile.dev]
debug = 0
incremental = true
[profile.test]
debug = 0
incremental = true
[profile.release]
opt-level = 3
lto = "off"
strip = "debuginfo"

[profile.local]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
