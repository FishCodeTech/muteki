[package]
name = "computer-use-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4", features = [
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = [
    "time",
    "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
log = "0.4"
mcp-host = { path = "../mcp-host" }
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tcode-services = { path = "../services" }
tcode-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan", "highsierra"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = [
    "control",
    "input",
    "pattern",
    "screenshot",
    "png",
] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "macos_overlay"
harness = false
